services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: backend/api/Dockerfile }
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://athena:athena@postgres:5432/athena?schema=public
      WEB_ORIGIN: http://localhost:8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-athena-local-access-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-athena-local-refresh-secret-change-in-production}
      COOKIE_SECURE: "false"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: { api: { condition: service_healthy } }
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: { web: { condition: service_started }, api: { condition: service_healthy } }
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    profiles: [ai]
    volumes: [ollama_data:/root/.ollama]
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment: { TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}" }
    depends_on: [nginx]
    profiles: [tunnel]
volumes:
  postgres_data:
  ollama_data:
